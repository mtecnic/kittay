<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kittay</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Kittay">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#1a1030">
<meta name="description" content="Kittay - an 8-bit virtual pet game from MTEC Labs. Adopt a kitten, help it grow into a cat, and play!">
<meta property="og:title" content="Kittay">
<meta property="og:description" content="Adopt a kitten or puppy, feed it, brush it, train it and play games together!">
<meta property="og:image" content="kittay-thumbnail.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="kittay-icon-512.png">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #120a1e; overflow: hidden;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    -webkit-text-size-adjust: 100%;
    touch-action: none;
  }
  #wrap { position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center; }
  #view { display: block; touch-action: none; image-rendering: pixelated; image-rendering: crisp-edges; }
  #io { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(18,10,30,0.7); z-index: 10;
    display: flex; align-items: center; justify-content: center; touch-action: auto; }
  #io[hidden] { display: none; }
  #io .box { width: min(86vw, 520px); background: #fff6e6; border: 4px solid #2a1a3a; border-radius: 10px;
    padding: 14px; font: 16px/1.35 -apple-system, Helvetica, Arial, sans-serif; color: #2a1a3a;
    box-shadow: 0 6px 0 #2a1a3a; -webkit-user-select: text; user-select: text; }
  #io h3 { margin: 0 0 8px; font-size: 18px; }
  #io p { margin: 0 0 8px; font-size: 14px; }
  #io textarea { width: 100%; box-sizing: border-box; height: 120px; font: 12px monospace; border: 2px solid #2a1a3a;
    border-radius: 6px; padding: 6px; -webkit-user-select: text; user-select: text; }
  #io .row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  #io button { flex: 1; font: bold 16px -apple-system, Helvetica, Arial, sans-serif; padding: 12px 8px; border-radius: 8px;
    border: 3px solid #2a1a3a; background: #ff6fa8; color: #fff; box-shadow: 0 3px 0 #2a1a3a; }
  #io button.alt { background: #4fb4ff; }
  #io button.gray { background: #9a90a8; }
  noscript { color: #fff; font: 18px sans-serif; position: absolute; top: 40%; width: 100%; text-align: center; }
</style>
</head>
<body>
<div id="wrap"><canvas id="view" width="320" height="240"></canvas></div>
<div id="io" hidden></div>
<noscript>Kittay needs JavaScript turned on to play.</noscript>
<script>
/*__SCRIPT__*/
</script>
</body>
</html>
